name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build (and push)
        uses: docker/bake-action@v6
        env:
          PLATFORMS: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          RELEASE_OPTIMIZED: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'true' || 'false' }}
          RUSTNZB_BUILD_REF: ${{ github.sha }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: rustnzb
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            cross-toolchain.cache-from=type=gha,scope=cross-toolchain
            cross-toolchain.cache-to=type=gha,scope=cross-toolchain,mode=max
            rustnzb.cache-from=type=gha,scope=rustnzb-${{ github.ref_name }}
            rustnzb.cache-to=type=gha,scope=rustnzb-${{ github.ref_name }},mode=max
